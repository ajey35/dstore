services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archivist_portal}
      POSTGRES_USER: ${POSTGRES_USER:-archivist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in portal/.env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  portal-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-archivist}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in portal/.env}@db:5432/${POSTGRES_DB:-archivist_portal}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-archivist}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in portal/.env}@db:5432/${POSTGRES_DB:-archivist_portal}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in portal/.env}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
      STORAGE_NODE_URL: ${STORAGE_NODE_URL:-http://host.docker.internal:8080/api/archivist/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORTAL_BIND_ADDRESS:-127.0.0.1}:${PORTAL_PORT:-3000}:3000"
    depends_on:
      portal-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
